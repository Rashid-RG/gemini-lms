<svg fill="none" viewBox="0 0 1024 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes floatBanner {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
      100% {
        transform: translateY(0px);
      }
    }
    @keyframes borderGlow {
      0% {
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)) drop-shadow(0 0 20px rgba(99, 102, 241, 0.2));
      }
      50% {
        filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.7)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.4));
      }
      100% {
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)) drop-shadow(0 0 20px rgba(99, 102, 241, 0.2));
      }
    }
    @keyframes gradientShift {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -3072;
      }
    }
    .floating-group {
      transform-origin: center;
      animation: floatBanner 6s ease-in-out infinite;
    }
    .glowing-border {
      animation: borderGlow 4s ease-in-out infinite;
    }
    .marching-gradient {
      stroke-dasharray: 1024;
      animation: gradientShift 30s linear infinite;
    }
  </style>
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="33%" stop-color="#8b5cf6" />
      <stop offset="66%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <!-- Clip Path for Rounded Corners -->
    <clipPath id="bannerClip">
      <rect x="8" y="8" width="1008" height="496" rx="20" />
    </clipPath>
  </defs>

  <!-- Main Animated Group -->
  <g class="floating-group">
    <!-- Background glow shadow block -->
    <rect x="8" y="8" width="1008" height="496" rx="20" fill="#030712" class="glowing-border" opacity="0.9" />

    <!-- Clipped Banner Image -->
    <g clip-path="url(#bannerClip)">
      <image href="gemini_lms_banner.png" x="8" y="8" width="1008" height="496" preserveAspectRatio="xMidYMid slice" />
    </g>

    <!-- Animated Border Overlay -->
    <rect x="8" y="8" width="1008" height="496" rx="20" fill="none" stroke="url(#glowGrad)" stroke-width="4" class="marching-gradient" pointer-events="none" />
  </g>
</svg>
