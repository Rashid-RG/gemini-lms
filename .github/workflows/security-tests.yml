name: Phase 1 security tests
on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check payment handler syntax
        run: |
          node --check 'app/api/(billing)/payments/payhere/initiate/route.js'
          node --check 'app/api/(billing)/payments/payhere/notify/route.js'
          node --check 'app/api/(billing)/payments/payhere/status/route.js'
          node --check 'app/api/(billing)/subscription/cancel/route.js'
          node --check 'app/api/(admin)/admin/payments/route.js'
          node --check 'app/api/(admin)/admin/payments/reconciliation/route.js'
          node --check lib/payherePricing.js
          node --check lib/payhereSignature.js
          node --check lib/userApiAuth.js
          node --check lib/recordAdaptivePerformance.js
          node --check lib/trustedAssessment.js
          node --check lib/verifiedAssessmentSummary.js
          node --check lib/verifiedProjection.js
          node --check 'app/api/(admin)/admin/assessments/reconcile/route.js'
          node --check 'app/api/(learning)/assessments/trusted/performance/route.js'
          node --check 'app/api/(learning)/assessments/trusted/start/route.js'
          node --check 'app/api/(learning)/assessments/trusted/submit/route.js'
          node --check 'app/api/(learning)/adaptive-performance/route.js'
          node --check 'app/api/(assignments)/submit-quiz/route.js'
      - run: npm test
